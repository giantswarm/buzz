suite: minio init job
templates:
  - templates/quickstart-minio-init.yaml
release:
  name: buzz
  namespace: buzz
set:
  relayUrl: wss://buzz.example.com
  ownerPubkey: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  externalPostgresql.url: postgres://buzz@postgres:5432/buzz
  minio.enabled: true
tests:
  - it: is a normal resource on install, named by the revision
    release:
      revision: 1
    asserts:
      - equal:
          path: metadata.name
          value: buzz-minio-init-1
      - notExists:
          path: metadata.annotations
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300
      - equal:
          path: spec.backoffLimit
          value: 10
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 120

  - it: is a pre-upgrade hook with a stable name on an upgrade that finds MinIO
    kubernetesProvider:
      scheme:
        "apps/v1/Deployment":
          gvr:
            group: apps
            version: v1
            resource: deployments
          namespaced: true
      objects:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: buzz-minio
            namespace: buzz
    release:
      revision: 21
      upgrade: true
    asserts:
      - equal:
          path: metadata.name
          value: buzz-minio-init
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300
      - equal:
          path: spec.backoffLimit
          value: 10

  - it: keeps the same name across upgrades, so the next attempt replaces a failed Job
    kubernetesProvider:
      scheme:
        "apps/v1/Deployment":
          gvr:
            group: apps
            version: v1
            resource: deployments
          namespaced: true
      objects:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: buzz-minio
            namespace: buzz
    release:
      revision: 22
      upgrade: true
    asserts:
      - equal:
          path: metadata.name
          value: buzz-minio-init

  - it: stays the normal revision-named Job on an upgrade that enables MinIO
    release:
      revision: 7
      upgrade: true
    asserts:
      - equal:
          path: metadata.name
          value: buzz-minio-init-7
      - notExists:
          path: metadata.annotations
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300

  - it: renders nothing without the bundled MinIO
    set:
      minio.enabled: false
      s3.endpoint: https://s3.example.com
      s3.bucket: buzz
      s3.accessKey: a
      s3.secretKey: b
    asserts:
      - hasDocuments:
          count: 0
