suite: s3.existingSecret
templates:
  - templates/deployment.yaml
  - templates/secret-chart.yaml
set:
  relayUrl: wss://buzz.example.com
  ownerPubkey: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  externalPostgresql.url: postgres://buzz@postgres:5432/buzz
  s3.endpoint: https://s3.example.com
  s3.accessKey: access
tests:
  - it: sources BUZZ_S3_SECRET_KEY from the chart-managed Secret by default
    template: templates/deployment.yaml
    set:
      s3.secretKey: inline
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BUZZ_S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-buzz-relay
                key: BUZZ_S3_SECRET_KEY
                optional: true

  - it: keeps BUZZ_S3_SECRET_KEY in the chart-managed Secret by default
    template: templates/secret-chart.yaml
    set:
      s3.secretKey: inline
    asserts:
      - equal:
          path: data.BUZZ_S3_SECRET_KEY
          value: aW5saW5l

  - it: follows secrets.existingSecret when s3.existingSecret is unset
    template: templates/deployment.yaml
    set:
      secrets.existingSecret: buzz-env
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BUZZ_S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: buzz-env
                key: BUZZ_S3_SECRET_KEY
                optional: true

  - it: sources BUZZ_S3_SECRET_KEY from s3.existingSecret when set
    template: templates/deployment.yaml
    set:
      s3.existingSecret.name: buzz-s3
      s3.existingSecret.key: secret-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BUZZ_S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: buzz-s3
                key: secret-key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BUZZ_S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-buzz-relay
                key: BUZZ_S3_ACCESS_KEY
                optional: true

  - it: defaults the key to BUZZ_S3_SECRET_KEY
    template: templates/deployment.yaml
    set:
      s3.existingSecret.name: buzz-s3
      s3.existingSecret.key: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BUZZ_S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: buzz-s3
                key: BUZZ_S3_SECRET_KEY

  - it: takes precedence over secrets.existingSecret for the S3 secret key
    template: templates/deployment.yaml
    set:
      secrets.existingSecret: buzz-env
      s3.existingSecret.name: buzz-s3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BUZZ_S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: buzz-s3
                key: BUZZ_S3_SECRET_KEY

  - it: leaves BUZZ_S3_SECRET_KEY out of the chart-managed Secret
    template: templates/secret-chart.yaml
    set:
      s3.existingSecret.name: buzz-s3
    asserts:
      - notExists:
          path: data.BUZZ_S3_SECRET_KEY
      - equal:
          path: data.BUZZ_S3_ACCESS_KEY
          value: YWNjZXNz

  - it: refuses s3.existingSecret with the bundled MinIO
    template: templates/secret-chart.yaml
    set:
      minio.enabled: true
      s3.existingSecret.name: buzz-s3
    asserts:
      - failedTemplate:
          errorPattern: s3.existingSecret is for external S3

  - it: refuses s3.existingSecret together with s3.secretKey
    template: templates/secret-chart.yaml
    set:
      s3.secretKey: inline
      s3.existingSecret.name: buzz-s3
    asserts:
      - failedTemplate:
          errorPattern: mutually exclusive
